<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ContractGuard - AtliQ Contract Risk Analyzer</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14181e;--mut:#5b6573;--line:#e3e6ea;--acc:#1f3a5f;--accb:#2f7bf6;--red:#b3261e;--redbg:#fdecea;--amb:#8a5a00;--ambbg:#fff4dc;--grn:#1b6b3a;--grnbg:#e6f4ea;--gry:#eef0f3;--r:12px}
@media (prefers-color-scheme:dark){:root{--bg:#0f1318;--card:#171c23;--ink:#e8ebef;--mut:#9aa4b2;--line:#2a313b;--acc:#8fb4ff;--accb:#5b9bff;--redbg:#3a1d1b;--red:#ff9d94;--ambbg:#3a2f12;--amb:#f5c76b;--grnbg:#16301f;--grn:#7fd49a;--gry:#222932}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
a{color:var(--accb);text-decoration:none;cursor:pointer}
.top{display:flex;align-items:center;justify-content:space-between;padding:12px max(16px,calc((100% - 1040px)/2 + 16px));background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.brand{font-weight:700;font-size:21px;letter-spacing:-.01em;color:var(--acc);cursor:pointer}.brand small{font-size:12px;font-weight:400;color:var(--mut);margin-left:8px;letter-spacing:0}
.wrap{max-width:1040px;margin:0 auto;padding:20px 16px 90px}
h1{font-size:24px;margin:6px 0 2px;font-weight:600}h2{font-size:16px;margin:22px 0 8px;font-weight:600}
.sub{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
button,.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:9px;cursor:pointer}
button:hover{border-color:var(--mut)}button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}@media (prefers-color-scheme:dark){button.pri{color:#0f1318}}
button[disabled]{opacity:.45;cursor:not-allowed}
.fab{width:42px;height:42px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--acc);border-color:var(--acc);color:#fff}@media (prefers-color-scheme:dark){.fab{color:#0f1318}}
.chip{display:inline-block;padding:3px 10px;border-radius:999px;font-size:12px;background:var(--gry);color:var(--mut);cursor:pointer;border:1px solid transparent}
.chip.on{background:var(--acc);color:#fff}@media (prefers-color-scheme:dark){.chip.on{color:#0f1318}}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;white-space:nowrap}
.sev-Serious{background:var(--redbg);color:var(--red)}.sev-Negotiable{background:var(--ambbg);color:var(--amb)}.sev-Minor{background:var(--gry);color:var(--mut)}
.ok{background:var(--grnbg);color:var(--grn)}.tag{background:var(--gry);color:var(--mut)}.warn{background:var(--ambbg);color:var(--amb)}
table{width:100%;border-collapse:collapse}th{font-size:12px;font-weight:500;color:var(--mut);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line)}
td{padding:11px 8px;border-bottom:1px solid var(--line);font-size:14px}tr.r{cursor:pointer}tr.r:hover td{background:var(--gry)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%}
textarea{min-height:150px;resize:vertical}label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
.grid{display:grid;gap:12px}.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.tile{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.tile b{display:block;font-size:22px;font-weight:600}.tile span{font-size:12px;color:var(--mut)}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:12px;background:var(--card)}
.find{border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;background:var(--card);margin:8px 0}
.find.s-Serious{border-left-color:var(--red)}.find.s-Negotiable{border-left-color:#d9a21b}
.fh{display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer}.fh .t{flex:1;font-weight:500}
.fb{padding:2px 14px 14px;border-top:1px solid var(--line)}
.quote{background:var(--gry);border-radius:8px;padding:9px 12px;margin:8px 0;font-size:13.5px}
.mut{color:var(--mut);font-size:13px}.hide{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal .card{max-width:480px;width:100%}
.foot{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px;z-index:6}
.foot .in{max-width:1040px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.steps li{margin:6px 0;color:var(--mut)}.steps li.done{color:var(--ink)}.steps li.done:before{content:"\2713  ";color:var(--grn)}.steps li.run:before{content:"\2022  ";color:var(--accb)}.steps li.bad{color:var(--amb)}
.bar{height:6px;border-radius:6px;background:var(--gry);overflow:hidden}.bar i{display:block;height:100%;background:var(--accb);width:0;transition:width .3s}
.star{font-size:24px;cursor:pointer;color:var(--mut);background:none;border:0;padding:2px}.star.on{color:#e0a800}
.links a{margin-right:14px}
@media (max-width:640px){.hm{display:none}td{padding:10px 4px}.card{overflow-x:auto}#q{max-width:none!important;margin-left:0!important;width:100%}h1{font-size:21px}.fh{flex-wrap:wrap}.fh .t{flex-basis:100%;order:3}}
</style>
</head>
<body>
<div class="top"><div class="brand" onclick="go('#/')"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-6px;margin-right:8px"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6l8-3z"/><path d="M9 12l2 2 4-4"/></svg>ContractGuard <small>by AtliQ</small></div><div class="row"><span id="badge"></span><a onclick="go('#/quality')" class="sub">Quality</a><a onclick="showPrinciples()" class="sub">Principles</a><span class="sub" id="who"></span></div></div>
<div class="wrap" id="app"></div>
<div id="modal"></div>
<script>
'use strict';
const KEY='atliq_v1';
let S, BASE=[], REG=[], SAMPLES=[], PRINC=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fresh=()=>({user:'Karandeep',added:[],reviews:{},entries:[],feedback:[],audit:[],usage:{calls:0,tin:0,tout:0,fallbacks:0},cache:{}});
function load(){try{return Object.assign(fresh(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){return fresh()}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function go(h){location.hash=h}
const today=()=>new Date().toISOString().slice(0,10);
const fmt=(v,c)=>v==null?'n/a':(c||'$')+Number(v).toLocaleString('en-US',{maximumFractionDigits:0});
const money=v=>v==null?'n/a':(v<0?'-':'')+(Math.abs(v)>=1000?'$'+Math.round(Math.abs(v)/1000)+'k':'$'+Math.abs(v));
const greeting=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const regStatus=r=>(!r.end)?'active':(r.end<today()?'expired':'active');
const entryStatus=r=>r.status==='pending_confirmation'?{t:'to confirm',k:'warn'}:r.status==='rejected'?{t:'rejected',k:'tag'}:(()=>{const x=regStatus(r);return{t:x,k:x==='active'?'sev-Negotiable':'tag'}})();
const pendingN=()=>S.entries.filter(e=>e.status==='pending_confirmation').length;
const DUP=new Set();
const qualityNote=q=>(!q||q.level==='good'||q.level==='unknown')?'':`<div class="card" style="margin:10px 0;border-color:var(--amb);background:var(--ambbg)"><b>${q.level==='poor'?'This text looks like a scan with misread characters.':'A few words look misread.'}</b> <span class="mut">For example ${esc((q.examples||[]).join(', '))}. Figures, dates and names may be wrong; check them against the original${q.level==='poor'?'. Model findings are marked "Not sure"':''}.</span></div>`;
const regCount=()=>REG.length+S.entries.filter(e=>e.status!=='rejected').length;
const confirmedEntries=()=>S.entries.filter(e=>e.status==='confirmed').map(e=>({id:e.id,contract_id:e.contract_id,counterparty:e.counterparty,type:e.type,clause:e.clause,bound:e.bound,restricted_activity:e.restricted_activity,scope:e.scope,start:e.start,end:e.end,quote:e.quote,takeaway:e.takeaway,status:'confirmed'}));
const allContracts=()=>BASE.concat(S.added);
const latest=cid=>{const v=S.reviews[cid];return v&&v.length?v[v.length-1]:null};
const vLabel=v=>v.status==='draft'?'Draft saved':v.status==='signed'?'Signed':v.status==='in_signing'?'In manual signing':v.status==='deferred'?'Signing deferred':'Reviewed';
function statusOf(c){const v=latest(c.id);if(v){const open=(v.findings||[]).filter(f=>f.severity==='Serious'&&!(v.answers||{})[f.id]).length;
 if(v.status==='signed')return{t:'Signed',k:'ok'};if(v.status==='in_signing')return{t:'In manual signing',k:'ok'};if(v.status==='deferred')return{t:'Signing deferred',k:'warn'};if(v.status==='draft')return{t:'Draft saved',k:'warn'};return open?{t:open+' serious open',k:'sev-Serious'}:{t:'Reviewed',k:'ok'}}
 return{t:c.status||'Unknown',k:'tag'}}

async function api(body,tries){tries=tries||2;
 for(let i=0;i<tries;i++){
  let r,j;const h={'Content-Type':'application/json'};try{const c=sessionStorage.getItem('atliq_code');if(c)h['X-Access-Code']=c}catch(e){}
  try{r=await fetch('/api/review',{method:'POST',headers:h,body:JSON.stringify(body)});j=await r.json()}catch(e){j={error:'network',message:'Could not reach the server.'};r={status:0}}
  if(r.status===200)return j;
  if(r.status===401&&j.error==='access'){const c=prompt('This demo needs an access code:');if(c){try{sessionStorage.setItem('atliq_code',c)}catch(e){}i--;continue}}
  if(r.status===429&&j.error==='quota'&&i<tries-1){await new Promise(s=>setTimeout(s,9000*(i+1)));continue}
  const err=new Error(j.message||'Request failed');err.code=j.error;throw err}}
function trackMeta(m){if(!m)return;S.usage.calls++;S.usage.tin+=m.in||0;S.usage.tout+=m.out||0;if(m.fallback){S.usage.fallbacks++}save();badge()}
function badge(){const f=S.usage.fallbacks;$('#badge').innerHTML=f?'<span class="pill warn" title="Gemini was busy; Groq answered">backup model used</span>':''}

/* ---------------- routing ---------------- */
function route(){const h=location.hash||'#/';const p=h.slice(2).split('/');$('#modal').innerHTML='';
 if(h==='#/'||h==='#'||p[0]==='')return home();
 if(p[0]==='new')return newPage(p[1]);
 if(p[0]==='import')return importPage();
 if(p[0]==='quality')return qualityPage();
 if(p[0]==='contract')return contractPage(decodeURIComponent(p[1]));
 if(p[0]==='review')return reviewPage(decodeURIComponent(p[1]),+p[2]);
 home()}

/* ---------------- home ---------------- */
let homeFilter='All',homeQ='',homeTab='contracts';
function home(){const cs=allContracts();const waiting=cs.filter(c=>/review/i.test(c.status)||/serious|deferred/i.test(statusOf(c).t)).length;const drafts=Object.keys(S.reviews).filter(k=>latest(k).status==='draft').length;
 const chips=['All','Needs review','Drafts','Signed'];
 let rows=cs.filter(c=>{const st=statusOf(c).t;
  if(homeFilter==='Needs review')return /review|serious open|Draft|deferred/i.test(st)&&!/Signed/i.test(c.status);
  if(homeFilter==='Drafts')return /Draft/i.test(st);
  if(homeFilter==='Signed')return /^Signed$/i.test(statusOf(c).t);
  return true}).filter(c=>!homeQ||(c.id+' '+c.counterparty+' '+c.type).toLowerCase().includes(homeQ));
 const regs=REG.concat(S.entries.map(e=>Object.assign({},e)));
 $('#app').innerHTML=`<div class="row sp"><div><div class="sub" style="margin-bottom:4px">AtliQ Contract Risk Analyzer: a second pair of eyes before you sign</div><h1>${greeting()}, ${esc(S.user)}</h1><div class="sub">${waiting} contract${waiting==1?'':'s'} waiting for review${drafts?' · '+drafts+' draft saved':''}</div></div>
  <button class="fab" title="Add contract or version" aria-label="Add contract or version" onclick="go('#/new')"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button></div>
  <div class="row" style="margin:16px 0 8px"><span class="chip ${homeTab==='contracts'?'on':''}" onclick="homeTab='contracts';home()">Contracts ${cs.length}</span><span class="chip ${homeTab==='commitments'?'on':''}" onclick="homeTab='commitments';home()">Past commitments ${regCount()}${pendingN()?' · '+pendingN()+' to confirm':''}</span>
   ${homeTab==='contracts'?chips.map(c=>`<span class="chip ${homeFilter===c?'on':''}" onclick="homeFilter='${c}';home()" style="background:${homeFilter===c?'':'transparent'};border-color:var(--line)">${c}</span>`).join(''):''}
   <input id="q" placeholder="Search" value="${esc(homeQ)}" style="max-width:220px;margin-left:auto" oninput="homeQ=this.value.toLowerCase();homeRows()"></div>
  <div class="card" style="padding:4px 8px" id="tbl"></div>`;
 homeRows()}
function homeRows(){const cs=allContracts();const regs=REG.concat(S.entries);let html;
 if(homeTab==='commitments'){const q=homeQ;const rs=regs.filter(r=>!q||(r.counterparty+' '+r.type+' '+(r.restricted_activity||'')).toLowerCase().includes(q));rs.sort((a,b)=>(b.status==='pending_confirmation')-(a.status==='pending_confirmation'));
  html=`<div class="row sp" style="padding:8px"><span class="mut">Restrictions AtliQ has agreed to, from signed contracts.</span><button onclick="go('#/import')">Import a signed contract</button></div>`+(pendingN()?`<div class="mut" style="padding:10px 8px"><b>${pendingN()} restriction${pendingN()>1?'s':''} waiting for confirmation.</b> Open one, check it against the source clause, then confirm or reject it. Only confirmed restrictions are used in future reviews.</div>`:'')+`<table><tr><th>Client</th><th class="hm">Type</th><th>What is restricted</th><th class="hm">Until</th><th>Status</th></tr>`+rs.map(r=>{const st=entryStatus(r);
   return`<tr class="r" onclick="showCommitment('${esc(r.id)}')"><td>${esc(r.counterparty)}</td><td class="hm">${esc((r.type||'').replace(/_/g,' '))}</td><td>${esc(r.restricted_activity||'')}</td><td class="hm">${esc(r.end||'no end date')}</td><td><span class="pill ${st.k}">${st.t}</span></td></tr>`}).join('')+'</table>';
  $('#tbl').innerHTML=html;return}
 let rows=cs.filter(c=>{const st=statusOf(c).t;
  if(homeFilter==='Needs review')return /review|serious open|Draft|deferred/i.test(st)&&!/Signed/i.test(c.status);
  if(homeFilter==='Drafts')return /Draft/i.test(st);
  if(homeFilter==='Signed')return /^Signed$/i.test(statusOf(c).t);return true}).filter(c=>!homeQ||(c.id+' '+c.counterparty+' '+c.type).toLowerCase().includes(homeQ));
 html=`<table><tr><th>ID</th><th>Client</th><th>Type</th><th class="hm">Country</th><th class="hm">Value</th><th>Status</th><th></th></tr>`+rows.map(c=>{const st=statusOf(c);
  return`<tr class="r" onclick="go('#/contract/${encodeURIComponent(c.id)}')"><td>${esc(c.id)}</td><td>${esc(c.counterparty)}</td><td>${esc(c.type)}</td><td class="hm">${esc(c.country||'')}</td><td class="hm">${money(c.value)}</td><td><span class="pill ${st.k}">${esc(st.t)}</span>${DUP.has(c.id)?' <span class="pill warn" title="Same client, type and value as another row in the tracker">possible duplicate</span>':''}${c.restrictions?` <span class="pill tag">${c.restrictions} restriction${c.restrictions>1?'s':''}</span>`:''}</td><td>&rsaquo;</td></tr>`}).join('')+'</table>';
 $('#tbl').innerHTML=html}
function showCommitment(id){const r=REG.concat(S.entries).find(x=>x.id===id);if(!r)return;if(r.status==='pending_confirmation')return confirmModal(r);const st=entryStatus(r);
 modal(`<div class="row sp"><b>${esc(r.counterparty)}</b><span class="pill ${st.k}">${st.t}</span></div>
 <div class="mut">${esc((r.type||'').replace(/_/g,' '))} · clause ${esc(r.clause||'')} · ${esc(r.bound||'')}</div>
 <div class="quote">${r.quote?esc(r.quote):'<span class="mut">No verified quote</span>'}</div>
 <div class="mut">Runs until: ${esc(r.end||'no end date')} ${r.end_basis?'('+esc(r.end_basis)+')':''}</div>${r.exception?`<p class="mut"><b>Exception:</b> ${esc(r.exception)}</p>`:''}${r.takeaway?`<p><b>Takeaway:</b> ${esc(r.takeaway)}</p>`:''}${r.status==='confirmed'?`<p class="mut">Confirmed by ${esc(r.confirmed_by||'')} on ${esc((r.confirmed_at||'').slice(0,10))}. Used in every new review.</p>`:''}${r.status==='rejected'?`<p class="mut">Rejected by ${esc(r.rejected_by||'')} on ${esc((r.rejected_at||'').slice(0,10))}${r.rejected_reason?': '+esc(r.rejected_reason):''}. Not used in reviews.</p>`:''}
 <div class="row" style="margin-top:10px">${r.file?`<a href="${esc(r.file)}" target="_blank">Open source contract</a>`:''}<button onclick="closeModal()" style="margin-left:auto">Close</button></div>`)}
function confirmModal(r){const g=((r.scope&&r.scope.geography)||[]).join(', ');const cu=(r.scope&&r.scope.customers)||'';
 modal(`<div class="row sp"><b>Confirm this restriction</b><span class="pill warn">to confirm</span></div>
 <div class="mut" style="margin:2px 0 8px">Taken from ${esc(r.counterparty)}, ${esc((r.type||'').replace(/_/g,' '))}, clause ${esc(r.clause||'?')}. Check it against the clause, correct anything, then confirm. It is only used in future reviews once you confirm it.</div>
 <div class="quote">${r.quote?esc(r.quote):'<span class="mut">No verified quote. Read the clause in the contract before confirming.</span>'}</div>
 <label>What is restricted</label><input id="cr_act" value="${esc(r.restricted_activity||'')}">
 <div class="grid g2" style="margin-top:8px"><div><label>Who or which customers it covers</label><input id="cr_cu" value="${esc(cu)}"></div><div><label>Where (comma separated; blank means worldwide)</label><input id="cr_geo" value="${esc(g==='Worldwide'?'':g)}"></div></div>
 <div class="grid g2" style="margin-top:8px"><div><label>Runs until (blank means no end date)</label><input id="cr_end" type="date" value="${esc(r.end||'')}"></div><div><label>Reason, if you reject it (optional)</label><input id="cr_rej" placeholder="For example: it does not restrict AtliQ"></div></div>
 <div class="row" style="margin-top:12px"><button class="pri" onclick="confirmEntry('${esc(r.id)}')">Confirm</button><button onclick="rejectEntry('${esc(r.id)}')">Reject</button><button onclick="closeModal()" style="margin-left:auto">Cancel</button></div>`)}
function confirmEntry(id){const e=S.entries.find(x=>x.id===id);if(!e)return;const v=i=>$('#'+i).value.trim();
 const geo=v('cr_geo').split(',').map(x=>x.trim()).filter(Boolean);
 e.restricted_activity=v('cr_act')||e.restricted_activity;e.scope={customers:v('cr_cu'),geography:geo.length?geo:['Worldwide']};e.end=v('cr_end')||null;
 e.takeaway=e.counterparty+', clause '+(e.clause||'?')+': '+e.restricted_activity+(e.scope.customers?' for '+e.scope.customers:'')+(geo.length?' in '+geo.join(', '):'')+(e.end?', until '+e.end:', with no end date')+'. Check before taking similar work.';
 e.status='confirmed';e.confirmed_by=S.user;e.confirmed_at=new Date().toISOString();
 S.audit.push({at:e.confirmed_at,who:S.user,what:'Confirmed restriction '+e.id,cid:e.contract_id});save();closeModal();route()}
function rejectEntry(id){const e=S.entries.find(x=>x.id===id);if(!e)return;
 e.status='rejected';e.rejected_by=S.user;e.rejected_at=new Date().toISOString();e.rejected_reason=($('#cr_rej')||{value:''}).value.trim();
 S.audit.push({at:e.rejected_at,who:S.user,what:'Rejected restriction '+e.id,cid:e.contract_id,comment:e.rejected_reason});save();closeModal();route()}
function modal(inner){$('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)closeModal()"><div class="card">${inner}</div></div>`}
function closeModal(){$('#modal').innerHTML=''}
function showPrinciples(){modal(`<b>AtliQ's principles</b><p class="mut">A preference, not a rule. Every contract is judged on its own context.</p><ul>${PRINC.map(p=>`<li>${esc(p.text)}</li>`).join('')}</ul>
 <div class="row" style="margin-top:8px"><button onclick="if(confirm('Clear all saved drafts, answers and feedback on this browser?')){localStorage.removeItem(KEY);location.hash='#/';location.reload()}">Reset demo data</button><button onclick="closeModal()" style="margin-left:auto">Close</button></div>`)}

/* ---------------- contract page ---------------- */
async function contractPage(id){const c=allContracts().find(x=>x.id===id);if(!c){return go('#/')}
 const vs=S.reviews[id]||[];const regs=REG.concat(S.entries).filter(r=>r.contract_id===id);
 $('#app').innerHTML=`<a onclick="go('#/')" class="sub">&lsaquo; All contracts</a>
 <div class="row sp"><div><h1>${esc(c.counterparty)} · ${esc(c.type)}</h1><div class="sub">${esc(c.id)} · ${esc(c.country||'country n/a')} · AtliQ ${esc(c.entity||'entity n/a')} · ${esc(statusOf(c).t)}</div></div>
 <div class="row">${(()=>{const lv=latest(id);return lv&&lv.status==='in_signing'?`<button class="pri" onclick="signedModal('${esc(id)}',${lv.ver})">Mark as signed</button>`:''})()}${c.file?`<button class="pri" onclick="startFromSample('${esc(c.file)}','${esc(id)}')">Review this contract</button>`:''}<button onclick="go('#/new/${encodeURIComponent(id)}')">New version</button></div></div>

const hash=async t=>{const b=new TextEncoder().encode(t);const d=await crypto.subtle.digest('SHA-256',b);return Array.from(new Uint8Array(d)).slice(0,8).map(x=>x.toString(16).padStart(2,'0')).join('')};
let RUN=null;
async function startReview(){const text=$('#ctext').value.trim(),notes=$('#ntext').value.trim();
 if(text.length<200){$('#msg').textContent='Paste or upload a contract first.';return}
 $('#goBtn').disabled=true;$('#msg').textContent='Reading the contract…';
 const verOf=$('#mVer').classList.contains('on')?$('#verOf').value:'';
 try{const key=await hash(text);let ex=S.cache['ex'+key];
  let manual=false;
  if(!ex){try{ex=await api({action:'extract',text},3);trackMeta(ex.meta);S.cache['ex'+key]=ex;save()}
   catch(e){if(!['quota','model','network','server'].includes(e.code))throw e;
    const sg=await api({action:'segment',text});manual=true;
    ex={details:{doc_type:'Other',counterparty:'',atliq_entity:'Unknown',atliq_role:'supplier',restrictive_covenants:[]},clauses:sg.clauses.length,quality:null}}}
  RUN={text,notes,verOf,key,details:ex.details,clausesN:ex.clauses,quality:ex.quality,manual};confirmPage()}catch(e){$('#goBtn').disabled=false;$('#msg').textContent=e.message+' Try again in a minute.'}}
function confirmPage(){const d=RUN.details,v=RUN.verOf;const cs=allContracts();const ex=v?cs.find(c=>c.id===v):null;
 const next='C-N'+String(S.added.length+1).padStart(2,'0');
 $('#app').innerHTML=`<h1>Confirm the details</h1><div class="sub">${RUN.manual?'The AI models are busy, so the details could not be read automatically. Please fill them in; the rule checks use what you enter, and the clause review will run if the models are back.':'Read from the contract. Please correct anything that is wrong.'}</div>${qualityNote(RUN.quality)}

  <div><label>Type</label><select id="f_ty">${['MSA','SOW','NDA','BAA','DPA','Partnership','Amendment','Other'].map(t=>`<option ${t===(d.doc_type||'Other')?'selected':''}>${t}</option>`).join('')}</select></div>

  <div><label>AtliQ is the</label><select id="f_ro">${[['supplier','Supplier (their paper)'],['buyer','Buyer (AtliQ&#39;s own paper)'],['partner','Partner']].map(([k,t])=>`<option value="${k}" ${k===(d.atliq_role||'supplier')?'selected':''}>${t}</option>`).join('')}</select></div>

const SEVN={Serious:0,Negotiable:1,Minor:2};
async function runReview(){const out=(document.querySelector('input[name=out]:checked')||{}).value;if(!out){$('#omsg').textContent='Please answer this question.';return}
 const v=id=>$('#'+id).value;const nz=x=>x===''?null:Number(x);
 const d=Object.assign({},RUN.details,{counterparty:v('f_cp'),doc_type:v('f_ty'),atliq_entity:v('f_en'),atliq_role:v('f_ro'),client_country:v('f_co'),term_months:nz(v('f_tm')),annual_fee:nz(v('f_af')),total_value:nz(v('f_tv')),governing_law:v('f_gl')});
 const cid=v('f_id').trim()||('C-N'+(S.added.length+1));const verOf=RUN.verOf;

 const ckey=await hash(RUN.text+'|'+RUN.notes+'|'+JSON.stringify([d.atliq_entity,d.annual_fee,d.total_value,d.term_months,d.governing_law,d.client_country,d.counterparty,d.atliq_role,confirmedEntries().map(e=>[e.id,e.end,e.restricted_activity])]));
 const steps=[{k:'rules',t:'Checking entity, law, documents and amounts'},{k:'conf',t:'Checking past commitments (17 contracts on file)'},{k:'cl',t:'Reviewing every clause'}];if(RUN.notes)steps.push({k:'notes',t:'Reading the unofficial discussions'});steps.push({k:'done',t:'Putting the review together'});

 const mark=(k,s,x)=>{const st=steps.find(z=>z.k===k);if(st){st.s=s;if(x!==undefined)st.x=x}paint()};
 paint();const t0=Date.now();
 try{
  let res=S.cache['rv'+ckey];
  if(!res){
   const seg=await api({action:'segment',text:RUN.text});const total=seg.clauses.length;const batches=seg.batches.map(b=>b.map(id=>seg.clauses.find(c=>c.id===id)));
   mark('rules','run');const rules=await api({action:'rules',details:d,text:RUN.text,contract_id:cid});mark('rules','done');RUN.pct=12;
   const pConf=(async()=>{mark('conf','run');try{const r=await api({action:'conflicts',details:d,text:RUN.text,extra_register:confirmedEntries(),exclude_contract:cid},3);trackMeta(r.meta);mark('conf','done');return r}catch(e){mark('conf','bad','could not finish');return{conflicts:[],checked:0,error:e.message}}})();
   const pNotes=RUN.notes?(async()=>{mark('notes','run');try{const r=await api({action:'notes',notes:RUN.notes,details:d,text:RUN.text},3);trackMeta(r.meta);mark('notes','done');return r}catch(e){mark('notes','bad','could not finish');return{items:[],error:e.message}}})():Promise.resolve({items:[]});
   mark('cl','run','0 of '+batches.length);const analysis=[];const couldNot=[];let done=0;let idx=0;
   const worker=async()=>{while(idx<batches.length){const i=idx++;const b=batches[i];try{const r=await api({action:'analyze',clauses:b,details:d,text:RUN.text},3);trackMeta(r.meta);analysis.push(r)}catch(e){b.forEach(c=>couldNot.push({id:c.id,why:e.message}))}done++;RUN.pct=12+Math.round(80*done/batches.length);mark('cl','run',done+' of '+batches.length)}};
   await Promise.all([worker(),worker()]);mark('cl',couldNot.length?'bad':'done',couldNot.length?couldNot.length+' clauses could not be checked':undefined);
   const conf=await pConf,nt=await pNotes;mark('done','run');const warnings=[];if(conf.error)warnings.push('conflicts');if(nt.error)warnings.push('notes');
   const m=await api({action:'merge',rules:rules.findings,conflicts:conf.conflicts,notes:nt.items,analysis:analysis.flatMap(a=>a.findings)});
   const reviewed=new Set(analysis.flatMap(a=>a.reviewed));
   res={findings:m.findings,clauses_total:total,clauses_reviewed:reviewed.size,could_not:couldNot,liability_multiple:rules.liability_multiple,liability_text:rules.liability_text,checked_register:conf.checked||0,checked_contracts:conf.checked_contracts||0,seconds:Math.round((Date.now()-t0)/1000),warnings:warnings};
   if(!couldNot.length&&!warnings.length){S.cache['rv'+ckey]=res;save()}}
  const vs=S.reviews[cid]||(S.reviews[cid]=[]);const ver={ver:vs.length+1,created:new Date().toISOString(),status:'draft',details:d,findings:res.findings,answers:{},clauses_total:res.clauses_total,clauses_reviewed:res.clauses_reviewed,could_not:res.could_not,warnings:res.warnings||[],notes_text:(RUN.notes||'').slice(0,60000),liability_multiple:res.liability_multiple,liability_text:res.liability_text,checked_register:res.checked_register,checked_contracts:res.checked_contracts,seconds:res.seconds,notes_attached:!!RUN.notes,out:RUN.out,quality:RUN.quality,text:RUN.text.slice(0,120000)};
  vs.push(ver);if(!verOf&&!allContracts().find(c=>c.id===cid)){S.added.push({id:cid,counterparty:d.counterparty||'New contract',type:d.doc_type,entity:d.atliq_entity,country:d.client_country,value:d.total_value,status:'In review',received:today(),restrictions:0,requested_by:S.user,notes:''})}

function partialBanner(v,cid){const cn=(v.could_not||[]).length,w=v.warnings||[];if(!cn&&!w.length)return '';
 const parts=[];if(cn)parts.push(cn+' clause'+(cn==1?'':'s')+' ('+v.could_not.map(x=>esc(x.id)).join(', ')+') could not be checked');if(w.includes('conflicts'))parts.push('the past-commitments check did not finish');if(w.includes('notes'))parts.push('the unofficial notes were not read');

async function retryMissing(cid,ver){const v=getRev(cid,ver);const b=$('#rtry');if(b){b.disabled=true;b.textContent='Retrying…'}
 try{
  const d=v.details;let add=[];const still=[];const reviewed=new Set();
  if((v.could_not||[]).length){const ids=new Set(v.could_not.map(x=>x.id));const seg=await api({action:'segment',text:v.text});
   const batches=seg.batches.map(bt=>bt.filter(id=>ids.has(id)).map(id=>seg.clauses.find(c=>c.id===id))).filter(bt=>bt.length);
   for(const bt of batches){try{const r=await api({action:'analyze',clauses:bt,details:d,text:v.text},3);trackMeta(r.meta);add=add.concat(r.findings||[]);(r.reviewed||[]).forEach(x=>reviewed.add(x))}catch(e){bt.forEach(c=>still.push({id:c.id,why:e.message}))}}}
  let conf=null,nt=null;const w=(v.warnings||[]).slice();
  if(w.includes('conflicts')){try{conf=await api({action:'conflicts',details:d,text:v.text,extra_register:confirmedEntries(),exclude_contract:cid},3);trackMeta(conf.meta)}catch(e){conf=null}}
  if(w.includes('notes')&&v.notes_text){try{nt=await api({action:'notes',notes:v.notes_text,details:d,text:v.text},3);trackMeta(nt.meta)}catch(e){nt=null}}
  const m=await api({action:'merge',rules:[],conflicts:conf?conf.conflicts:[],notes:nt?nt.items:[],analysis:add});
  const key=f=>[f.source,f.topic,f.clause_id,f.register_id,f.title].join('|');const have=new Set((v.findings||[]).map(key));
  let n=Math.max(0,...(v.findings||[]).map(f=>parseInt(String(f.id).slice(1))||0));
  const rank={Serious:0,Negotiable:1,Minor:2};
  (m.findings||[]).filter(f=>!have.has(key(f))).forEach(f=>{f.id='F'+String(++n).padStart(2,'0');v.findings.push(f)});
  v.findings.sort((a,b)=>(rank[a.severity]??3)-(rank[b.severity]??3)||String(a.id).localeCompare(String(b.id)));
  v.could_not=still;v.clauses_reviewed=Math.min(v.clauses_total,(v.clauses_reviewed||0)+reviewed.size);
  v.warnings=w.filter(x=>(x==='conflicts'&&!conf)||(x==='notes'&&!nt));
  if(conf){v.checked_register=conf.checked||0;v.checked_contracts=conf.checked_contracts||0}
  S.audit.push({at:new Date().toISOString(),who:S.user,what:'Retried missing parts of the review',cid,ver:v.ver,left:still.length+v.warnings.length});save();reviewPage(cid,v.ver)
 }catch(e){const mm=$('#rmsg');if(mm)mm.textContent=e.message+' Try again in a minute.';if(b){b.disabled=false;b.textContent='Retry the missing parts'}}}

 const rated=fin.filter(x=>fb(x));const missedNo=rated.filter(x=>fb(x).missed==='no').length;
 const secs=all.map(x=>x.v.seconds||0).sort((a,b)=>a-b);const med=secs.length?secs[Math.floor(secs.length/2)]:0;const p95=secs.length?secs[Math.min(secs.length-1,Math.floor(secs.length*0.95))]:0;
 const auto=x=>(x.v.seconds||0)<300&&x.v.clauses_reviewed===x.v.clauses_total&&(x.v.checked_register||0)>0&&!(x.v.could_not&&x.v.could_not.length)&&(x.v.findings||[]).every(f=>f.quote||f.absence||f.source==='rule'||f.unsure||f.source==='unofficial');
 const autoN=all.filter(auto).length;const trrN=all.filter(x=>auto(x)&&fb(x)&&fb(x).missed==='no').length;
 const stars=rated.map(x=>fb(x).stars).filter(Boolean);const avg=stars.length?(stars.reduce((a,b)=>a+b,0)/stars.length).toFixed(1):'n/a';
 const failWhy=x=>{const v=x.v,r=[];if((v.seconds||0)>=300)r.push('took over 5 minutes');if(v.clauses_reviewed!==v.clauses_total||(v.could_not&&v.could_not.length))r.push('not every clause was checked (models busy)');if(!((v.checked_register||0)>0))r.push('past commitments were not checked');if(!(v.findings||[]).every(f=>f.quote||f.absence||f.source==='rule'||f.unsure||f.source==='unofficial'))r.push('a finding had no verified quote');return r};
 const why={};all.filter(x=>!auto(x)).forEach(x=>failWhy(x).forEach(r=>why[r]=(why[r]||0)+1));
 const drafts=all.length-fin.length;
 const explain=`<div class="card mut" style="margin-top:12px"><b style="color:var(--ink)">Why the Trusted Review Rate is ${all.length?Math.round(100*trrN/all.length)+'%':'n/a'}.</b> It is counted over all ${all.length} reviews fed into the tool, and a review counts as trusted only if it passed every automatic check <i>and</i> its reviewer tapped "Nothing missed". Here: ${fin.length} finished (proceeded or deferred), ${drafts} still drafts or never finished; ${rated.length} of the finished ${fin.length==1?'one was':'ones were'} rated; ${autoN} passed the automatic checks and ${trrN} of those were also tapped "Nothing missed". The 5.0 rating and the 100% above are over rated reviews only, so they do not move the rate.${Object.keys(why).length?` Did not pass the automatic checks: ${Object.keys(why).map(r=>why[r]+' '+r).join('; ')}.`:''}</div>`;
 const reasons={};S.feedback.forEach(f=>(f.reasons||[]).forEach(r=>reasons[r]=(reasons[r]||0)+1));
 const pct=(a,b)=>b?Math.round(100*a/b)+'%':'n/a';
 $('#app').innerHTML=`<a onclick="go('#/')" class="sub">&lsaquo; Home</a><h1>Quality of the reviews</h1>
 <div class="sub">The North Star, measured from the reviews done in this browser. With real users this comes from the audit log.</div>
 <div class="grid g4" style="margin-top:12px"><div class="tile"><b>${all.length}</b><span>reviews fed into the tool</span></div><div class="tile"><b>${pct(trrN,all.length)}</b><span>Trusted Review Rate (target 90%)</span></div><div class="tile"><b>${pct(autoN,all.length)}</b><span>passed the automatic checks</span></div><div class="tile"><b>${pct(rated.length,fin.length)}</b><span>tap rate on the end screen (needs 70%)</span></div></div>
 <div class="grid g4" style="margin-top:12px"><div class="tile"><b>${pct(missedNo,rated.length)}</b><span>of rated reviews: "nothing missed"</span></div><div class="tile"><b>${avg}</b><span>average rating (of 5)</span></div><div class="tile"><b>${med}s</b><span>median review time</span></div><div class="tile"><b>${p95}s</b><span>slowest 5% (limit 300s)</span></div></div>
 ${explain}<h2>What counts</h2><div class="card mut">A review is trusted when it finished in under 5 minutes, read every clause, showed the coverage line, showed a verified quote for every model finding (or marked it "not sure"), could not skip a clause, <b>and</b> the reviewer tapped "Nothing missed". Reviews with no tap count as unconfirmed, not as a pass. Below a 70% tap rate the rate is not reliable.</div>
 <h2>Reasons given</h2>${Object.keys(reasons).length?`<div class="row">${Object.keys(reasons).map(r=>`<span class="pill tag">${esc(r)} · ${reasons[r]}</span>`).join('')}</div>`:'<div class="mut">No reasons recorded yet.</div>'}
 <h2>Operations <span class="mut" style="font-weight:400">(for the product team; not needed to review a contract)</span></h2><div class="mut">Model use in this browser: ${S.usage.calls} model calls, ${S.usage.tin.toLocaleString()} tokens in, ${S.usage.tout.toLocaleString()} out; backup model used ${S.usage.fallbacks} time${S.usage.fallbacks==1?'':'s'}.</div>`}

/* ---------------- boot ---------------- */
async function boot(){S=load();$('#who').textContent=S.user;
 try{[BASE,REG,SAMPLES,PRINC]=await Promise.all(['data/contracts.json','data/register.json','data/samples.json','data/principles.json'].map(u=>fetch(u).then(r=>r.json())))}catch(e){$('#app').innerHTML='<div class="card">Could not load data files.</div>';return}
 const g={};BASE.forEach(c=>{if(!c.value)return;const k=(c.counterparty||'')+'|'+(c.type||'')+'|'+c.value;(g[k]=g[k]||[]).push(c.id)});Object.values(g).forEach(a=>{if(a.length>1)a.forEach(id=>DUP.add(id))});
 badge();window.addEventListener('hashchange',route);route()}
boot();
</script>
</body></html>
